server.port=${PORT:8081}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://apfelkomplott-ui-a531.vercel.app,https://apfelkomplott.cs.hs-fulda.de}
